services:
  - type: web
    name: potholeguard-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    plan: free
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: AUTHORITY_API_KEY
        value: potholeguard_admin_key_2026
      - key: DATABASE_URL
        fromDatabase:
          name: potholeguard-postgres
          property: connectionString

databases:
  - name: potholeguard-postgres
    databaseName: potholeguard
    user: potholeguard
    plan: free
