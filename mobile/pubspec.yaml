name: potholeguard
description: "PotholeGuard - Autonomous Road Safety and Pothole Alert System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^5.0.1
  geolocator: ^11.0.0
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  flutter_tts: ^4.0.2
  vibration: ^2.0.0
  http: ^1.2.0
  sqflite: ^2.3.2
  path: ^1.9.0
  wakelock_plus: ^1.2.1
  provider: ^6.1.1
  uuid: ^4.3.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true
